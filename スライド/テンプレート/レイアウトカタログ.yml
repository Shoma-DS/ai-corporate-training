# スライド図解エリアのレイアウトカタログ（100型）
#
# 使い方:
#   1. スライド案を書く前に、各スライドの「言いたいことの構造（message_structure）」を決める。
#   2. structure_guide から候補レイアウトを引き、slots を埋められるものを1つ（主）選ぶ。
#      密度が足りないときだけ、補助レイアウトを1つ足す（主+補助の最大2つ）。
#   3. スライド案に `**レイアウト:** L027 横棒ランキング型（+ L050 注釈付きグラフ型）` のように記録する。
#   4. 画像生成プロンプトは scripts/rebuild_gws_high_density_image_prompts.py がこのファイルを読み、
#      レイアウト名・用途・slots・pattern を図解エリアの構成指示として埋め込む。
#
# 前提:
#   - 画風は常に isometric-corporate-clean（スライド/テンプレート/カタログ.yml）。このカタログは画風ではなく
#     「固定ワイヤーフレームの図解エリア内の組み方」だけを決める。ヘッダー帯・見出し帯・今回のまとめ帯・
#     目次ストリップは変えない。章見出し/現在位置スライドはヒーロー表示のまま（このカタログ対象外）。
#   - pattern は カタログ.yml の diagram_patterns の id。スライド案の `**図解パターン:**` にはこれを書く。
#   - 原典は第三者の参考図版（非公開/参考資料/AI資料レイアウト100選/、Git管理外）。ここには型名と用途を
#     抽象化して記録しており、図版そのものは public repo に置かない。

version: 1
source_reference: 非公開/参考資料/AI資料レイアウト100選/  # ローカルのみ。無い環境ではこのYAMLだけで運用できる

message_structures:
  conclusion-evidence:
    name: 結論と根拠（ピラミッド）
    question: 「なぜそう言えるのか」に答えるスライドか
    verify_device: 結論の横に、根拠の数字・出所・内訳を置いて見出しを確かめられるようにする
  segmentation:
    name: 切り口（分類）
    question: 同じ対象を、業種・規模・工程などの軸で分けて見せるスライドか
    verify_device: 分類軸を明記し、全項目を同じ軸で並べる（順位・構成比・マトリクス）
  difference:
    name: 差分（比較）
    question: 前後・案同士・現状と理想の違いを見せるスライドか
    verify_device: 両者を同じ尺度で並べ、差（何時間減・何pt改善など）を式つきで残す
  cause-effect:
    name: 原因と結果（因果）
    question: 条件を変えると結果がどう変わるかを示すスライドか
    verify_device: 前提・式・試算値を画面に出す。相関しか無いデータで因果を言い切らない
  gap-solution:
    name: 不足と打ち手（問題解決）
    question: 課題・不足に対して何を打つかを示すスライドか
    verify_device: 不足→打ち手→埋まる分/残る分を対応づけて見せる
  sequence:
    name: 流れと時間（順序）
    question: 手順・工程・時系列・ロードマップを示すスライドか
    verify_device: 順番・担当・期限・現在地（いまの線）を明示する
  navigation:
    name: 導入・案内・締め
    question: 表紙・目次・定義・まとめ・質疑など、講座の進行を案内するスライドか
    verify_device: 学習者が「いまどこで、次に何を作るか」を読み取れるようにする

# 構造ごとの第一候補（左ほど汎用）。研修スライドで迷ったらここから選ぶ。
structure_guide:
  conclusion-evidence: [L002, L079, L025, L007, L019, L087, L050, L065]
  segmentation: [L027, L031, L032, L030, L008, L012, L036, L045, L068, L088]
  difference: [L009, L003, L077, L044, L043, L023, L010, L029, L047]
  cause-effect: [L091, L038, L040, L066, L067, L034, L064, L065]
  gap-solution: [L076, L077, L022, L024, L074, L092, L078, L059]
  sequence: [L006, L083, L005, L051, L052, L053, L055, L057, L071, L072]
  navigation: [L001, L013, L014, L020, L021, L012, L095, L097, L098]

# fit: training=研修スライドでそのまま使える / limited=条件付き / avoid=原則使わない（理由を note に記載）
layouts:
  # ── 1/4 構成・要点・比較（001-025）
  - {id: L001, name: タイトルスライド, group: 構成・要点・比較, structure: navigation, pattern: scene-environment, purpose: 表紙でテーマと期待感を伝える, slots: [講座名, 回タイトル, 一言の到達点, 成果物予告カード], fit: training}
  - {id: L002, name: 1メッセージ型, group: 構成・要点・比較, structure: conclusion-evidence, pattern: data-insight, purpose: 1枚1論点で主張を強く見せる, slots: [大きな数字か一文, 補足1行, 根拠カード2-3枚], fit: limited, note: 単独では疎になるため根拠カードか補助レイアウトを必ず足す}
  - {id: L003, name: 2カラム比較型, group: 構成・要点・比較, structure: difference, pattern: comparison-contrast, purpose: 2つの案を並べて違いを見せる, slots: [A見出し, B見出し, 同じ観点の対応行3-5], fit: training}
  - {id: L004, name: 3ポイント並列型, group: 構成・要点・比較, structure: segmentation, pattern: module-block, purpose: 要点を3つに分けて整理する, slots: [番号付きカード3枚, 各カードの具体例], fit: training}
  - {id: L005, name: タイムライン型, group: 構成・要点・比較, structure: sequence, pattern: roadmap-timeline, purpose: 出来事を時系列で並べる, slots: [時点4-6, 各時点の出来事], fit: training}
  - {id: L006, name: フロー型, group: 構成・要点・比較, structure: sequence, pattern: process-flow, purpose: 手順を進む順番で示す, slots: [ステップ3-5, 入力/処理/出力/確認], fit: training}
  - {id: L007, name: ピラミッド型, group: 構成・要点・比較, structure: conclusion-evidence, pattern: hierarchy-pyramid, purpose: 結論と根拠の階層を示す, slots: [結論, 理由・根拠, 詳細・データ], fit: training}
  - {id: L008, name: マトリクス型, group: 構成・要点・比較, structure: segmentation, pattern: matrix-classification, purpose: 2つの軸で位置づけを示す, slots: [縦軸名, 横軸名, 4象限ラベルと該当例], fit: training}
  - {id: L009, name: Before／After型, group: 構成・要点・比較, structure: difference, pattern: before-after-transformation, purpose: 改善前後の変化を見せる, slots: [Before状態, After状態, 変化量と算出式], fit: training}
  - {id: L010, name: KPIダッシュボード型, group: 構成・要点・比較, structure: difference, pattern: data-insight, purpose: 主要な数値をひと目で見せる, slots: [KPIカード3-4, 増減, 測り方], fit: training}
  - {id: L011, name: 事例紹介カード型, group: 構成・要点・比較, structure: conclusion-evidence, pattern: module-block, purpose: 課題・施策・成果をまとめる, slots: [架空企業名と業種, 課題, 施策, 成果数値], fit: training, note: 事例は架空または公開事例のみ。実在顧客名は入れない}
  - {id: L012, name: まとめ型, group: 構成・要点・比較, structure: navigation, pattern: checklist-confirmation, purpose: 要点と次の行動を締めくくる, slots: [要点3つ, 次の行動の帯], fit: training}
  - {id: L013, name: 目次型, group: 構成・要点・比較, structure: navigation, pattern: roadmap-timeline, purpose: 全体の構成と読む順を示す, slots: [章番号と章名, 時間配分, 各章の成果物], fit: training}
  - {id: L014, name: セクション扉型, group: 構成・要点・比較, structure: navigation, pattern: scene-environment, purpose: 章の切り替えを印象づける, slots: [章番号, 章名, 次の一手], fit: limited, note: 章見出し/現在位置スライドは既存のヒーロー表示ルールを優先する}
  - {id: L015, name: 左図右文型, group: 構成・要点・比較, structure: conclusion-evidence, pattern: data-insight, purpose: 図と説明を隣に配置する, slots: [主役の図（幅6割）, 右の説明3点], fit: training}
  - {id: L016, name: 全面写真＋帯型, group: 構成・要点・比較, structure: navigation, pattern: scene-environment, purpose: 背景を広く使い言葉を重ねる, slots: [背景シーン, 一言], fit: avoid, note: 固定ワイヤーフレームと密度基準に合わない。パンフレット表紙など限定用途のみ}
  - {id: L017, name: 問いかけ型, group: 構成・要点・比較, structure: navigation, pattern: scene-environment, purpose: 問いを大きく置き関心を引く, slots: [問い, 問いの背景, 本章で答える項目], fit: limited, note: 導入用。問いの下に答えの予告カードを置いて疎にしない}
  - {id: L018, name: 引用強調型, group: 構成・要点・比較, structure: conclusion-evidence, pattern: module-block, purpose: 重要な発言を主役にする, slots: [引用文, 発言者の立場（匿名）, 示唆], fit: limited, note: 実在人物の発言は出典確認済みのものだけ}
  - {id: L019, name: 数字インパクト型, group: 構成・要点・比較, structure: conclusion-evidence, pattern: data-insight, purpose: 伝えたい数字を大きく見せる, slots: [大きな数字1つ, 何の数字か, 算出式, 前提], fit: training}
  - {id: L020, name: 定義カード型, group: 構成・要点・比較, structure: navigation, pattern: module-block, purpose: 言葉の意味と具体例を示す, slots: [用語, 定義, 業務での具体例], fit: training}
  - {id: L021, name: 用語対照表型, group: 構成・要点・比較, structure: navigation, pattern: matrix-classification, purpose: 用語と意味を対応させる, slots: [用語/意味/例 の表3-6行], fit: training}
  - {id: L022, name: メリット・注意点型, group: 構成・要点・比較, structure: gap-solution, pattern: governance-risk, purpose: 利点と留意点をセットで示す, slots: [メリット3, 注意点3, 対策], fit: training}
  - {id: L023, name: 選択肢比較表型, group: 構成・要点・比較, structure: difference, pattern: comparison-contrast, purpose: 同じ基準で複数案を比較する, slots: [評価項目3-5, 案2-4, ◎○△], fit: training}
  - {id: L024, name: 推奨案強調型, group: 構成・要点・比較, structure: gap-solution, pattern: funnel-selection, purpose: 選ぶ理由と推奨案を目立たせる, slots: [案2-3, 推奨案, 選定理由], fit: training}
  - {id: L025, name: エグゼクティブ要約型, group: 構成・要点・比較, structure: conclusion-evidence, pattern: hierarchy-pyramid, purpose: 結論・根拠・判断を先に示す, slots: [結論, 根拠2-3, 判断事項], fit: training}

  # ── 2/4 データ・分析・グラフ（026-050）
  - {id: L026, name: 縦棒グラフ型, group: データ・分析・グラフ, structure: segmentation, pattern: data-insight, purpose: 項目ごとの大きさを比較する, slots: [図表タイトル（何を・いつ・単位）, 項目と値, 主役の棒], fit: training}
  - {id: L027, name: 横棒ランキング型, group: データ・分析・グラフ, structure: segmentation, pattern: data-insight, purpose: 多い順に並べて順位を示す, slots: [図表タイトル, 項目と値（降順）, 主役の項目], fit: training}
  - {id: L028, name: 折れ線推移型, group: データ・分析・グラフ, structure: sequence, pattern: data-insight, purpose: 時間による増減を見せる, slots: [期間, 値, 変化点], fit: training}
  - {id: L029, name: 積み上げ棒型, group: データ・分析・グラフ, structure: difference, pattern: data-insight, purpose: 合計と内訳の変化を見せる, slots: [期間, 内訳系列2-3, 合計], fit: training}
  - {id: L030, name: 100%積み上げ型, group: データ・分析・グラフ, structure: segmentation, pattern: data-insight, purpose: 比率の違いに絞って比較する, slots: [対象, 構成比], fit: training}
  - {id: L031, name: 円グラフ型, group: データ・分析・グラフ, structure: segmentation, pattern: data-insight, purpose: 全体に占める割合を示す, slots: [3-5区分と割合], fit: training}
  - {id: L032, name: ドーナツ内訳型, group: データ・分析・グラフ, structure: segmentation, pattern: data-insight, purpose: 中央に合計、周囲に内訳を置く, slots: [合計, 内訳3-5], fit: training}
